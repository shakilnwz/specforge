# Publishes the latest release's install.sh to GitHub Pages, so that
#
#   curl -fsSL https://shakilnwz.github.io/specforge/install.sh | bash -s -- install
#
# serves the same file as https://github.com/shakilnwz/specforge/releases/latest/download/install.sh.
# Only the installer is published: it downloads its release's tarball from GitHub Releases and
# verifies the checksum there.
#
# Runs when a release is published, and by hand (Actions → Publish installer → Run workflow) to
# redeploy. It belongs to the kit's repository and is never part of template/.

name: Publish installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}install.sh
    steps:
      - name: Fetch the latest release's installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download --repo "$GITHUB_REPOSITORY" --pattern install.sh --dir site
          # The stamped installer, not an unreleased checkout's copy
          grep -qx "SPECFORGE_REPO='$GITHUB_REPOSITORY'" site/install.sh
          bash -n site/install.sh

      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
